name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run smoke

  check-deploy:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOST_INTERNET_CL }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare API token found. Deploy will run."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare API token secret is missing. Deploy will be skipped."
          fi

  deploy:
    needs: [verify, check-deploy]
    if: github.ref == 'refs/heads/main' && needs.check-deploy.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.LOST_INTERNET_CL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync integration secrets to Worker
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YANDEX_MUSIC_TOKEN: ${{ secrets.YANDEX_MUSIC_TOKEN }}
        run: |
          set -euo pipefail
          sync_secret() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx --yes wrangler@4.168.0 secret put "$1"
            else
              echo "::notice::$1 is not set in GitHub Secrets; skipping."
            fi
          }
          sync_secret SPOTIFY_CLIENT_ID "$SPOTIFY_CLIENT_ID"
          sync_secret SPOTIFY_CLIENT_SECRET "$SPOTIFY_CLIENT_SECRET"
          sync_secret YANDEX_MUSIC_TOKEN "$YANDEX_MUSIC_TOKEN"
      - run: npm run build
      - run: npx --yes wrangler@4.168.0 deploy
      - run: npm run smoke
